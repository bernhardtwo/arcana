name: Arcana
version: '${version}'
main: com.bernhardtwo.arcana.ArcanaPlugin
api-version: '1.21'
description: Item-bound magic abilities for Paper servers.
author: Bernardo Vega
website: https://github.com/bernhardtwo/arcana
softdepend:
  - GriefPrevention
commands:
  arcana:
    description: Manages the ability staffs.
    usage: /arcana give <player> <staff> | /arcana list | /arcana reload | /arcana reset [player] [ability]
    permission: arcana.admin
permissions:
  arcana.admin:
    description: Access to the Arcana admin commands.
    default: op
  arcana.use.gravity_push:
    description: "Allows casting Gravity: Push."
    default: true
  arcana.use.gravity_pull:
    description: "Allows casting Gravity: Pull."
    default: true
  arcana.use.gravity_leap:
    description: "Allows casting Gravity: Leap."
    default: true
  arcana.use.ice_slash:
    description: "Allows casting Ice: Slash."
    default: true
  arcana.use.ice_breaker:
    description: "Allows casting Ice: Breaker."
    default: true
  arcana.use.ice_armor:
    description: "Allows casting Ice: Armor."
    default: true
  arcana.use.solar_lantern:
    description: "Allows casting Solar: Lantern."
    default: true
  arcana.use.solar_zenith:
    description: "Allows casting Solar: Zenith."
    default: true
  arcana.use.solar_bloom:
    description: "Allows casting Solar: Bloom."
    default: true
  arcana.use.shadow_blink:
    description: "Allows casting Shadow: Blink."
    default: true
  arcana.use.shadow_swap:
    description: "Allows casting Shadow: Swap."
    default: true
  arcana.use.shadow_body:
    description: "Allows casting Shadow: Body."
    default: true
