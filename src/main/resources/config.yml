# Arcana
# Strength values are in blocks per tick. For reference, a vanilla jump starts
# with a vertical velocity of 0.42.

effects: true

targets:
  players: true
  hostiles: true
  passives: true
  armor-stands: false
  respect-claims: true

abilities:
  gravity_push:
    radius: 12.0
    strength: 2.6
    lift: 0.6
    max-velocity: 4.0
    cooldown-ticks: 100
    cancel-fall-damage:
      players: false
      mobs: true
    fall-grace-ticks: 120

  gravity_pull:
    radius: 28.0
    strength: 2.2
    lift: 0.35
    max-velocity: 3.5
    cooldown-ticks: 140
    cancel-fall-damage:
      players: false
      mobs: true
    fall-grace-ticks: 120

  gravity_leap:
    jump-power: 0.9
    forward-boost: 0.35
    cooldown-ticks: 20
    fall-grace-ticks: 100

  ice_slash:
    range: 3.5
    arc-degrees: 70.0
    slash-damage: 4.0
    snowball-damage: 3.0
    snowball-speed: 1.8
    freeze-ticks: 60
    slow-duration-ticks: 40
    cooldown-ticks: 30

  ice_breaker:
    range: 24.0
    damage: 7.0
    freeze-ticks: 100
    slow-duration-ticks: 60
    cooldown-ticks: 120

  ice_armor:
    charges: 3
    orbit-radius: 1.2
    orbit-height: 1.0
    orbit-speed: 0.12
    idle-seconds: 15
    cooldown-ticks: 1200
    block-abilities-while-active: false
    strong-attackers:
      - WARDEN
      - ENDER_DRAGON
      - WITHER
      - GHAST

  solar_lantern:
    duration-ticks: 24000
    cooldown-ticks: 12000
    orbit-radius: 0.9

  solar_zenith:
    height: 6
    radius: 20.0
    burn-ticks: 60
    heal-amount: 1.0
    tick-interval: 20
    marker-interval: 10
    marker-height: 12.0
    marker-rings: 5
    marker-points-per-ring: 32
    marker-particle-size: 1.6
    marker-color-a: "FFFFFF"
    marker-color-b: "FF6A00"
    marker-force-render: true
    marker-gradient-cycles: 2.0
    marker-gradient-speed: 0.02
    cooldown-ticks: 18000

  solar_bloom:
    max-charges: 5
    charge-regen-minutes: 12
