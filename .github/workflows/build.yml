name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate YAML resources
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --user pyyaml
          python3 - <<'PY'
          import yaml
          for path in ("src/main/resources/plugin.yml", "src/main/resources/config.yml"):
              with open(path) as f:
                  yaml.safe_load(f)
              print("ok", path)
          PY
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Arcana-jar
          path: build/libs/*.jar
